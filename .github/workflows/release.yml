name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install && bun run build

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/index.js
          generate_release_notes: true
